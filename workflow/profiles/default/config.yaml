# Profil SLURM pour Snakemake (>= 8.x avec snakemake-executor-plugin-slurm).
# Usage : snakemake --profile profiles/slurm

executor: slurm
jobs: 50

# Active la directive `envmodules:` des règles -> `module load` sur le nœud.
use-envmodules: true

# Ressources par défaut (overridables par règle via `resources:`)
default-resources:
  slurm_account: "def-acheng_cpu"
  slurm_partition: "default"
  mem_mb: 1000
  runtime: 60          # minutes
  cpus_per_task: 1

# Robustesse
restart-times: 1
max-jobs-per-second: 5
max-status-checks-per-second: 5
local-cores: 1
latency-wait: 60
keep-going: true
rerun-incomplete: true
printshellcmds: true
